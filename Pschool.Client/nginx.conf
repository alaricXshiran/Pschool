# Web server settings for the Blazor app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Unknown addresses such as /parents load index.html; Blazor then shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch these fresh, so a new API address or app version is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache";
    }
}